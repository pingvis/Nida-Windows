[package]
name = "nida-browser-checks"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the real manager/Windows transport independently of FFmpeg, audio,
# capture and Servo's native dependencies. This is not a second implementation.
[features]
default = []
html = []
windows-browser = []

[dependencies]
wgpu = "30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5.5.0"
log = "0.4"
dirs = "6.0.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
