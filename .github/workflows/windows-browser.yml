name: Windows browser checks (experimental)

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-browser-sources]

permissions:
  contents: read

concurrency:
  group: windows-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Set up pinned CEF SDK
        shell: pwsh
        run: ./scripts/ci/setup-windows-cef.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-cef')
      - name: Build sandboxed CEF helper
        shell: pwsh
        run: ./scripts/ci/build-windows-browser.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'Nida browser helper')
      - name: Test real browser pixels and live updates
        shell: pwsh
        run: |
          python scripts/ci/test-browser-host.py (Join-Path $env:RUNNER_TEMP 'Nida browser helper/browser/nida-browser-host.exe')
          if ($LASTEXITCODE -ne 0) { throw 'CEF browser source smoke test failed.' }
      - name: Test Rust browser manager and Windows transport
        env:
          NIDA_BROWSER_TEST_HELPER: '${{ runner.temp }}\Nida browser helper\browser\nida-browser-host.exe'
        run: cargo test --locked --manifest-path browser/checks/Cargo.toml --features windows-browser --lib
