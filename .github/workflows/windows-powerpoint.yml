name: Windows PowerPoint

on:
  pull_request:
    paths:
      - 'src/internal/presentation/**'
      - 'src/app/state/presentations.rs'
      - 'src/usecases/ui/panels/add_input.rs'
      - 'src/usecases/ui/panels/file_drop.rs'
      - 'src/usecases/ui/panels/presentation.rs'
      - 'scripts/ci/test-windows-powerpoint.ps1'
      - '.github/workflows/windows-powerpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerpoint:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Test Windows PowerShell command handling
        shell: powershell
        run: ./scripts/ci/test-windows-powerpoint.ps1
      - name: Formatting diagnostics
        shell: pwsh
        run: |
          cargo fmt --all
          git diff -- src/internal/presentation src/app/state/presentations.rs src/usecases/ui/panels/add_input.rs src/usecases/ui/panels/file_drop.rs src/usecases/ui/panels/presentation.rs
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set up FFmpeg and libclang
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/setup-windows-build.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-build-tools')
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-powerpoint
      - name: Check Windows application and tests
        run: cargo check --all-targets --locked --no-default-features --features screen-capture
      - name: Test presentation worker and Windows helper transport
        run: 'cargo test --lib --locked --no-default-features --features screen-capture presentation::'
      - name: Test PowerPoint input availability
        run: cargo test --lib --locked --no-default-features --features screen-capture powerpoint_is_offered
