name: Windows portable and installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for both downloads, e.g. v0.9.1-beta.4. Empty uses the selected tag, or Cargo.toml on a branch.'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'scripts/windows/**'
      - 'scripts/ci/*windows*'
      - 'scripts/ci/setup-inno.ps1'
      - 'scripts/ci/*browser*'
      - 'scripts/ci/setup-windows-cef.ps1'
      - 'scripts/ci/extract-windows-cef.py'
      - 'scripts/ci/test-windows-cef-extraction.py'
      - '.github/actions/windows-cef/**'
      - 'assets/nida.ico'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build browser-enabled portable ZIP and Inno installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - name: Select shared release version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Import-Module ./scripts/ci/windows-package.psm1 -Force
          $tag = if ($env:SOURCE_REF_TYPE -eq 'tag') { $env:SOURCE_REF_NAME } else { '' }
          $version = Resolve-WindowsReleaseVersion -RequestedVersion $env:RELEASE_VERSION -PackageVersion $packageVersion -TagVersion $tag
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Keep dependency cache tied to the pinned Rust compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # rust-cache hashes every installed toolchain. Extra Rust versions
          # in the hosted runner image must not invalidate our dependency cache.
          $active = ((& rustup show active-toolchain) -split '\s+')[0]
          if ($LASTEXITCODE -ne 0 -or $active -notlike '1.99.1-*-pc-windows-msvc') {
            throw "Expected pinned Rust 1.99.1, got: $active"
          }
          $installed = @(& rustup toolchain list --quiet)
          if ($LASTEXITCODE -ne 0 -or $active -notin $installed) {
            throw 'Could not confirm the active toolchain is installed.'
          }
          foreach ($toolchain in $installed) {
            if ($toolchain -ne $active) {
              Write-Host "Removing unused hosted-runner toolchain from cache identity: $toolchain"
              & rustup toolchain uninstall $toolchain
              if ($LASTEXITCODE -ne 0) { throw "Could not remove unused toolchain: $toolchain" }
            }
          }
          Write-Host "Rust dependency cache compiler: $active"
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test packaging dependency handling
        shell: pwsh
        run: ./scripts/ci/test-windows-package-helpers.ps1
      - name: Test CEF extraction and progress reporting
        run: python scripts/ci/test-windows-cef-extraction.py
      - name: Test browser smoke-test frame readiness
        run: python scripts/ci/test-browser-host-expect.py
      - name: Test CEF cache validation
        shell: pwsh
        run: ./scripts/ci/test-windows-cef-cache.ps1
      - name: Set up FFmpeg 9 and libclang 20
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/setup-windows-build.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-build-tools')
      - name: Set up pinned portable Inno Setup compiler
        shell: pwsh
        run: ./scripts/ci/setup-inno.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-inno')
      - name: Set up pinned CEF SDK
        uses: ./.github/actions/windows-cef
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release-browser
          cache-on-failure: true
      - name: Build and verify browser-enabled portable package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/ci/build-windows.ps1 -WithBrowser -ReleaseVersion $env:RELEASE_VERSION
      - name: Build installer and exercise install, upgrade and uninstall
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = @(Get-ChildItem dist/windows/*.zip)
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified portable ZIP.' }
          ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion $env:RELEASE_VERSION
          $version = ($env:RELEASE_VERSION -split '-')[0]
          $first = ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion "$version-installer-test.1" -TestIdentity -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer-fixtures')
          $next = ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion "$version-installer-test.2" -TestIdentity -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer-fixtures')
          ./scripts/ci/test-windows-installer.ps1 -Installer $first.FullName -UpgradeInstaller $next.FullName
      - name: Upload portable ZIP, installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Nida-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/windows/*-portable.zip
            dist/windows/*-portable.zip.sha256
            dist/windows-installer/*-Setup.exe
            dist/windows-installer/*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Windows portable and installer
          Download the versioned **Nida-…-windows-x64** artifact under this run's **Artifacts**.
          It contains the portable ZIP, Inno Setup executable and their matching SHA256 files, already named for the selected version.
          Both formats contain the same browser-enabled payload and Nida icon. Extract the portable ZIP fully, or run the file ending in **-Setup.exe**.
          Select the source branch/tag with **Run workflow → Use workflow from**; the version input labels both downloads, not the source ref.
          Tag builds use the selected tag version and reject a conflicting version input. Branch builds default to Cargo.toml if version is empty.
          This workflow has read-only repository access and does not create releases, tags or branches.
          '@ >> $env:GITHUB_STEP_SUMMARY
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-test-logs
          path: ${{ runner.temp }}/Nida installer test */*.log
          if-no-files-found: ignore
          retention-days: 14
