name: Windows installer (files only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional setup version, e.g. 0.9.1-beta.2. This is a file label, not a branch or tag. Empty uses Cargo.toml.'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'scripts/windows/**'
      - 'scripts/ci/*windows*'
      - 'scripts/ci/setup-inno.ps1'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - name: Select setup file version
        id: version
        shell: pwsh
        env:
          SETUP_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $version = ([string]$env:SETUP_VERSION).Trim() -replace '^v', ''
          if (!$version) { $version = $packageVersion }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') { throw 'Use a setup version such as 0.9.1-beta.2, or leave it empty.' }
          if (($version -split '-')[0] -ne ($packageVersion -split '-')[0]) { throw 'The numeric setup version must match Cargo.toml.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test packaging dependency handling
        shell: pwsh
        run: ./scripts/ci/test-windows-package-helpers.ps1
      - name: Set up FFmpeg 9 and libclang 20
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/setup-windows-build.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-build-tools')
      - name: Set up pinned portable Inno Setup compiler
        shell: pwsh
        run: ./scripts/ci/setup-inno.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-inno')
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-portable-core
          cache-on-failure: true
      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/ci/build-windows.ps1
      - name: Build installer and exercise install, upgrade and uninstall
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = @(Get-ChildItem dist/windows/*.zip)
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified portable ZIP.' }
          ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion $env:RELEASE_VERSION
          $version = ($env:RELEASE_VERSION -split '-')[0]
          $first = ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion "$version-installer-test.1" -TestIdentity -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer-fixtures')
          $next = ./scripts/ci/build-windows-installer.ps1 -Archive $archive[0].FullName -ReleaseVersion "$version-installer-test.2" -TestIdentity -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer-fixtures')
          ./scripts/ci/test-windows-installer.ps1 -Installer $first.FullName -UpgradeInstaller $next.FullName
      - name: Upload setup file and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Nida-Windows-installer
          path: |
            dist/windows-installer/*-Setup.exe
            dist/windows-installer/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Windows setup file
          Download **Nida-Windows-installer** under this run's **Artifacts**, extract it, and run the file ending in **-Setup.exe**.
          The artifact also includes its SHA256 checksum. The version input only labels the setup file; it does not select or create a Git ref.
          This workflow has read-only repository access and does not create releases, tags or branches.
          '@ >> $env:GITHUB_STEP_SUMMARY
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-test-logs
          path: ${{ runner.temp }}/Nida installer test */*.log
          if-no-files-found: ignore
          retention-days: 14
