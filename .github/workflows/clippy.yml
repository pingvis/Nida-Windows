name: clippy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact fork branch or commit to validate
        required: true
        type: string
  pull_request:
    branches: [main]
    # Allowlist: docs, README, CONTRIBUTING, LICENSE, and .gitignore are
    # omitted on purpose so PRs that only touch them skip this workflow.
    # GitHub forbids combining `paths` with `paths-ignore` on one event.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/clippy.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Clippy only analyses code that compiles for the *host* target, so a
# `#[cfg(target_os = ...)]` block is invisible to every other platform's run. A
# Linux-only job therefore cannot see the macOS or Windows branches — and those
# branches do exist (NDI library loading, CLI install, shader search paths,
# Syphon restore). Each supported platform gets its own job so the pedantic gate
# covers all of them.
jobs:
  clippy-linux:
    name: clippy (linux)
    # ubuntu-24.04 (glibc 2.39) required: ort's prebuilt ONNX Runtime
    # references __isoc23_strtol / __isoc23_strtoull / __isoc23_strtoll
    # which only exist in glibc >= 2.38. ubuntu-22.04 (glibc 2.35) fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.ref }}

      - name: Install system dependencies
        run: |
          # libfreenect-dev lives in the `universe` component — enable it so the
          # default-on `depth` feature's -lfreenect resolves for --all-targets
          # (test/bench binaries link) — see spec/depth-sensors.md.
          # libpipewire-0.3-dev backs the default-on `screen-capture` feature:
          # libspa-sys resolves libpipewire-0.3 through pkg-config at build time,
          # so its absence fails the build outright. See spec/screen-capture.md.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            libsrt-gnutls-dev \
            libasound2-dev \
            libv4l-dev \
            libfreenect-dev \
            libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev \
            libgtk-3-dev
          # Fail loudly here (not at the opaque linker error) if the dev symlink
          # the linker needs for -lfreenect is missing.
          test -e /usr/lib/x86_64-linux-gnu/libfreenect.so \
            || { echo "::error::libfreenect-dev did not provide libfreenect.so"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `clippy::pedantic` is enabled as warn-by-default in Cargo.toml's
      # `[lints.clippy]` (with a documented allow-list), so `-D warnings` gates
      # pedantic here too. Keeping the lint config in Cargo.toml rather than in
      # this flag means a local `cargo clippy` reproduces CI exactly.
      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings

  clippy-macos:
    name: clippy (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.ref }}

      - name: Install dependencies
        run: |
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-srt
          brew install cmake pkg-config nasm
          # libfreenect backs the default-on `depth` feature — see spec/depth-sensors.md.
          brew install libfreenect

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Homebrew's arm64 prefix is not on the default linker search path, and
      # `--all-targets` links test/bench binaries. See AGENTS.md.
      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings
        env:
          LIBRARY_PATH: /opt/homebrew/lib

  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Set up FFmpeg 9 and libclang 20
        shell: pwsh
        run: |
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP 'ffmpeg-dev'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip' -OutFile $ffmpegArchive
          Expand-Archive -LiteralPath $ffmpegArchive -DestinationPath $ffmpegExtract
          $ffmpegRoot = (Get-ChildItem $ffmpegExtract -Directory | Select-Object -First 1).FullName
          if (!(Test-Path (Join-Path $ffmpegRoot 'include/libavcodec/avcodec.h'))) { throw 'Missing FFmpeg development headers' }
          foreach ($dll in Get-ChildItem (Join-Path $ffmpegRoot 'bin') -Filter '*.dll') {
            if ($dll.Name -notmatch '^(avcodec|avdevice|avfilter|avformat|avutil|swresample|swscale|postproc)-\d+\.dll$') { continue }
            $libraryName = $dll.BaseName -replace '-\d+$', ''
            $exports = @(& dumpbin.exe /nologo /exports $dll.FullName | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') { '  ' + $Matches[1] }
            })
            if (!$exports.Count) { throw "No exports for $($dll.Name)" }
            $definition = Join-Path $ffmpegRoot "lib/$libraryName.def"
            $importLibrary = Join-Path $ffmpegRoot "lib/$libraryName.lib"
            [IO.File]::WriteAllLines($definition, @("LIBRARY $($dll.Name)", 'EXPORTS') + $exports, [Text.Encoding]::ASCII)
            & lib.exe /nologo /machine:x64 "/def:$definition" "/out:$importLibrary"
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate MSVC import library' }
          }
          $clangArchive = Join-Path $env:RUNNER_TEMP 'libclang.zip'
          $clangExtract = Join-Path $env:RUNNER_TEMP 'libclang-dev'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/libclang.runtime.win-x64/20.1.2/libclang.runtime.win-x64.20.1.2.nupkg' -OutFile $clangArchive
          Expand-Archive -LiteralPath $clangArchive -DestinationPath $clangExtract
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$clangExtract/runtimes/win-x64/native" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=4" >> $env:GITHUB_ENV
          (Join-Path $ffmpegRoot 'bin') >> $env:GITHUB_PATH

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Feature set matches the Windows release build: `depth` (libfreenect) has
      # no vcpkg port, so it is excluded and the other defaults re-added. See
      # spec/depth-sensors.md § Platform Support. `screen-capture` stays in —
      # its Windows backend is pure-Rust `windows` bindings needing no vcpkg
      # port, and this job is the only place that backend gets compiled.
      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets --no-default-features --features face-detection,html,screen-capture -- -D warnings
