name: Windows portable (experimental)

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-portable-package]

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Core Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test packaging dependency handling
        shell: pwsh
        run: ./scripts/ci/test-windows-package-helpers.ps1
      - name: Set up FFmpeg 9 and libclang 20
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/setup-windows-build.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nida-build-tools')
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-portable-core
          cache-on-failure: true
      - name: Build, package and test the extracted ZIP
        shell: pwsh
        run: ./scripts/ci/build-windows.ps1
      - name: Upload experimental ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Nida-Windows-x64-experimental
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Package status
        shell: pwsh
        run: |
          @'
          ## Experimental Windows core package
          Download **Nida-Windows-x64-experimental** under this run's Artifacts, then extract the inner application ZIP.
          Startup and FFmpeg H.264/AAC encode/probe/decode were tested with only the package and Windows on PATH.
          This does not qualify desktop capture, GPU presentation, secondary-display colors, or live-show stability.
          Optional HTML, face detection, Kinect and the NDI runtime are not bundled.
          This workflow creates a test artifact, not a public GitHub Release or a signed installer.
          '@ >> $env:GITHUB_STEP_SUMMARY
